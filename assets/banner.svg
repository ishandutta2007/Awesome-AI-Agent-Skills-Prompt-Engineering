<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Card/Border Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="glowOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.95; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes pulseStream {
      0% { stroke-dashoffset: 200; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .orb-anim1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb-anim2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 950px 250px; }
    .pill-anim1 { animation: floatPill1 5s ease-in-out infinite; }
    .pill-anim2 { animation: floatPill2 6s ease-in-out infinite; }
    .stream-anim { stroke-dasharray: 20, 15; animation: pulseStream 4s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono-text { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 13px; font-weight: 600; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-anim1" cx="220" cy="140" r="180" fill="url(#glowOrb1)" />
  <circle class="orb-anim2" cx="980" cy="240" r="210" fill="url(#glowOrb2)" />

  <!-- Animated Circuit / Flow Lines (Background Layer) -->
  <g opacity="0.45">
    <path class="stream-anim" d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-anim" d="M 50 360 Q 350 400 650 350 T 1150 370" fill="none" stroke="#818cf8" stroke-width="2" />
    <line x1="120" y1="210" x2="1080" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="4,8" opacity="0.6" />
  </g>

  <!-- Dynamic Animated Tech Badges / Floating Elements (Framing the Canvas) -->
  <g class="pill-anim1">
    <!-- Top Left Pill -->
    <rect x="60" y="35" width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" filter="url(#dropShadow)" />
    <circle cx="78" cy="52" r="5" fill="#38bdf8" />
    <text x="94" y="57" fill="#e2e8f0" class="mono-text">SKILL.md Spec</text>
  </g>

  <g class="pill-anim2">
    <!-- Top Right Pill -->
    <rect x="980" y="35" width="160" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" filter="url(#dropShadow)" />
    <circle cx="998" cy="52" r="5" fill="#818cf8" />
    <text x="1014" y="57" fill="#e2e8f0" class="mono-text">DSPy / MIPROv2</text>
  </g>

  <g class="pill-anim2">
    <!-- Bottom Left Pill -->
    <rect x="60" y="345" width="180" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" filter="url(#dropShadow)" />
    <circle cx="78" cy="362" r="5" fill="#a855f7" />
    <text x="94" y="367" fill="#e2e8f0" class="mono-text">LLMOps &amp; Prompts</text>
  </g>

  <g class="pill-anim1">
    <!-- Bottom Right Pill -->
    <rect x="960" y="345" width="180" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" filter="url(#dropShadow)" />
    <circle cx="978" cy="362" r="5" fill="#06b6d4" />
    <text x="994" y="367" fill="#e2e8f0" class="mono-text">Red-Teaming &amp; Evals</text>
  </g>

  <!-- Central Foreground Shield / Content Hub -->
  <g filter="url(#dropShadow)">
    <!-- High-Contrast Frosted Backing Box for Title Clarity -->
    <rect x="150" y="95" width="900" height="230" rx="20" fill="#0b1120" fill-opacity="0.88" stroke="#334155" stroke-width="1.5" />
    <rect x="150" y="95" width="900" height="2" fill="url(#primaryGrad)" />

    <!-- Overline Category -->
    <g transform="translate(600, 138)">
      <text text-anchor="middle" fill="#38bdf8" class="mono-text" letter-spacing="3" font-size="12">
        CURATED PRODUCTION ECOSYSTEM • 2026 EDITION
      </text>
    </g>

    <!-- Main Title in Sharp Foreground -->
    <g transform="translate(600, 192)">
      <text text-anchor="middle" class="title-text" font-size="44" fill="#ffffff" filter="url(#dropShadow)">
        AI Agent Skills &amp; Prompt Engineering
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(600, 234)">
      <text text-anchor="middle" class="body-text" font-size="18" fill="#94a3b8">
        Modular Agent Packs (SKILL.md) • Automated Prompt Optimizers • LLMOps &amp; CI/CD Evals
      </text>
    </g>

    <!-- Floating Capability Pills Centered Under Title -->
    <g transform="translate(230, 268)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
        <text x="65" y="18" text-anchor="middle" fill="#93c5fd" class="mono-text" font-size="11">Agent Skills</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect x="0" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
        <text x="72" y="18" text-anchor="middle" fill="#c7d2fe" class="mono-text" font-size="11">Prompt Tuning</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(305, 0)">
        <rect x="0" y="0" width="145" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
        <text x="72" y="18" text-anchor="middle" fill="#e9d5ff" class="mono-text" font-size="11">LLM Registries</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(465, 0)">
        <rect x="0" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="1" />
        <text x="70" y="18" text-anchor="middle" fill="#99f6e4" class="mono-text" font-size="11">Security Evals</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#f472b6" stroke-width="1" />
        <text x="60" y="18" text-anchor="middle" fill="#fbcfe8" class="mono-text" font-size="11">Open-Source</text>
      </g>
    </g>
  </g>

  <!-- Modern Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#475569" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
